<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h1>User Registration</h1>

    <form action="/register" method="POST" enctype="multipart/form-data">

       
        <!-- TODO 1: مجموعة المعلومات الشخصية -->
        <fieldset>
            <legend> Personal Information</legend>
            <label for="fullname">First Name: </label>
            <input type="text" id="fullname" name="First_name" minlength="3" placeholder="Enter your first name" required>
            <br>
            <label for="email">Email: </label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
            <br>
            <label for="pass">Password: </label>
            <input type="password" id="pass" name="password" minlength="8" placeholder="Min 8 characters" required>
            <br>
            <label for="con-pass">Confirm Password: </label>
            <input type="password" id="con-pass" name="Confirm_Password" required>
            <br>
            <label for="dob">Date of Birth: </label>
            <input type="date" id="dob" name="date_of_birth" required>
        </fieldset>

         <!-- TODO 2: مجموعة معلومات التواصل -->
        <fieldset>
            <legend> Contact Information</legend>
            <label for="phone">Phone: </label>
            <input type="tel" id="phone" name="phone" placeholder="+970-xxx-xxx-xxxx" pattern="[0-9+\-]{10,15}" title="Format: 059-123-4567">
            <br>
            <textarea name="address" id="address" rows="3" cols="40" placeholder="Enter the address"></textarea>
            <br>
            <label for="city">Select City: </label>
            <select name="City" id="city">
                <option value="gaza">Gaza</option>
                <option value="khan">Khan Younis</option>
                <option value="rafah">Rafah</option>
                <option value="d_balah">Deir al-Balah</option>
                <option value="jabalia">Jabalia</option>
            </select>
        </fieldset>

        <!-- TODO 3: مجموعة التفضيلات -->
        <fieldset>

            <legend> Preferences</legend>
            <p>Gender:</p>
              <input type="radio" id="male" name="gender" value="male">
              <label for="male">Male</label>
              
              <input type="radio" id="female" name="gender" value="female">
              <label for="female">Female</label> 

              <p>Interests:</p>
               <input type="checkbox" id="coding" name="interests" value="coding">
                <label for="coding">Coding</label><br>

                <input type="checkbox" id="design" name="interests" value="design">
                <label for="design">Design</label><br>

                <input type="checkbox" id="gaming" name="interests" value="gaming" >
                <label for="gaming">Gaming</label><br>

                <input type="checkbox" id="reading" name="interests" value="reading">
                <label for="reading">Reading</label><br>

                <input type="checkbox" id="sports" name="interests" value="sports">
                <label for="sports">Sports</label><br>

                <input type="range" id="skill" name="skill" min="1" max="10" value="5">
                <label for="skill">Skill Level (1-10): </label>
        </fieldset>
        
        <!-- TODO 4: الصورة الشخصية -->
         <label for="photo">Profile Picture:</label>
         <input type="file" id="photo" name="photo" accept="image/*">
         <br>

        <!-- TODO 5: الشروط والأزرار -->
          <input type="checkbox" id="terms" name="terms" required> 
          <label for="terms">I agree to the Terms and Conditions</label><br>
          <button type="submit">Register</button> 
          <button type="reset">Clear Form</button>
       

    </form>

</body>
</html>
